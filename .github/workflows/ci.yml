name: Eigen Tidy Plugin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-with-llvm-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_LOCAL_NAME: eigen-tidy-plugin

    strategy:
      matrix:
        include:
          - clang-version: 15
            ubuntu-version: jammy
          - clang-version: 16
            ubuntu-version: jammy
          - clang-version: 17
            ubuntu-version: noble
          - clang-version: 18
            ubuntu-version: noble
          - clang-version: 19
            ubuntu-version: noble

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format and clang-tidy
      run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy

    - name: Check clang-format formatting
      run: ./tools/clang_format.sh check

    - name: Configure compilation database
      run: cmake -S eigen_tidy_plugin -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Check clang-tidy diagnostics
      run: ./tools/clang_tidy.sh check build

    - name: Compute image name (lowercase)
      id: meta
      shell: bash
      run: |
        echo "image_name=${GITHUB_REPOSITORY,,}/clang-base" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Test with Clang ${{ matrix.clang-version }} on ${{ matrix.ubuntu-version }}
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace \
          ghcr.io/${{ steps.meta.outputs.image_name }}:clang-${{ matrix.clang-version }}-${{ matrix.ubuntu-version }} \
          bash -c "\
            set -euxo pipefail; \
            git config --global --add safe.directory /workspace; \
            cd /workspace; \
          ./tools/test_example_repo_local_build.sh \
          "
