name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        llvm-version: [17, 18]

    steps:
    - uses: actions/checkout@v4

    - name: Install LLVM and Clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh ${{ matrix.llvm-version }}

        # Install development packages
        sudo apt-get update
        sudo apt-get install -y \
          llvm-${{ matrix.llvm-version }}-dev \
          clang-${{ matrix.llvm-version }} \
          clang-tidy-${{ matrix.llvm-version }} \
          libclang-${{ matrix.llvm-version }}-dev \
          cmake \
          build-essential

    - name: Set up environment
      run: |
        echo "/usr/lib/llvm-${{ matrix.llvm-version }}/bin" >> $GITHUB_PATH
        echo "LLVM_DIR=/usr/lib/llvm-${{ matrix.llvm-version }}/lib/cmake/llvm" >> $GITHUB_ENV
        echo "Clang_DIR=/usr/lib/llvm-${{ matrix.llvm-version }}/lib/cmake/clang" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_DIR=$LLVM_DIR \
          -DClang_DIR=$Clang_DIR \
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.llvm-version }}

    - name: Build plugin
      run: |
        cd build
        make -j$(nproc)

    - name: Verify plugin
      run: |
        ls -la build/
        file build/clang-tidy-eigen.so

        # Test that the plugin can be loaded and check works
        echo "namespace Eigen { template<class T, int R, int C> class Matrix {}; }" > test.cpp
        echo "void test() { using namespace Eigen; Matrix<double,-1,-1> m; auto x = m; }" >> test.cpp

        if clang-tidy-${{ matrix.llvm-version }} \
          --load ./build/clang-tidy-eigen.so \
          --checks='-*,eigen-avoid-auto' \
          test.cpp -- -std=c++17 2>&1 | grep -q "eigen-avoid-auto"; then
          echo "✓ Plugin loads successfully and check works"
        else
          echo "✗ Plugin test failed"
          exit 1
        fi
        rm test.cpp

    - name: Run tests
      run: |
        # Test the plugin with our test cases
        echo "Running plugin tests..."
        clang-tidy-${{ matrix.llvm-version }} \
          --load ./build/clang-tidy-eigen.so \
          --checks='-*,eigen-avoid-auto' \
          test_cases.cpp \
          -- -std=c++17 \
          | tee test_output.log

        # Verify we get expected warnings (at least 3)
        warning_count=$(grep -c "eigen-avoid-auto" test_output.log || true)
        echo "Found $warning_count warnings"

        if [ "$warning_count" -ge 3 ]; then
          echo "✓ Test passed: Found expected warnings"
        else
          echo "✗ Test failed: Expected at least 3 warnings, got $warning_count"
          cat test_output.log
          exit 1
        fi

    - name: Test example project
      run: |
        cd example/mini
        echo "Testing example with mock Eigen..."
        clang-tidy-${{ matrix.llvm-version }} \
          --load ../../build/clang-tidy-eigen.so \
          --checks='-*,eigen-avoid-auto' \
          main.cpp \
          -- -std=c++17 -DMOCK_EIGEN \
          | tee output.log

        # Check that we got some warnings
        warning_count=$(grep -c "eigen-avoid-auto" output.log || true)
        echo "Found $warning_count warnings in example"

        if [ "$warning_count" -gt 0 ]; then
          echo "✓ Found expected warnings in example"
        else
          echo "✗ No warnings found in example"
          cat output.log
          exit 1
        fi

  build-with-eigen:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 17

        sudo apt-get update
        sudo apt-get install -y \
          llvm-17-dev \
          clang-17 \
          clang-tidy-17 \
          libclang-17-dev \
          libeigen3-dev \
          cmake \
          build-essential

    - name: Build with real Eigen
      run: |
        export PATH="/usr/lib/llvm-17/bin:$PATH"
        export LLVM_DIR=/usr/lib/llvm-17/lib/cmake/llvm
        export Clang_DIR=/usr/lib/llvm-17/lib/cmake/clang

        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_DIR=$LLVM_DIR \
          -DClang_DIR=$Clang_DIR \
          -DCMAKE_CXX_COMPILER=clang++-17
        make -j$(nproc)

    - name: Test with real Eigen
      run: |
        cd example/mini
        echo "Testing example with real Eigen..."
        clang-tidy-17 \
          --load ../../build/clang-tidy-eigen.so \
          --checks='-*,eigen-avoid-auto' \
          main.cpp \
          -- -std=c++17 -I/usr/include/eigen3 \
          | tee output.log

        # Check that we got warnings for the bad cases
        warning_count=$(grep -c "eigen-avoid-auto" output.log || true)
        echo "Found $warning_count warnings with real Eigen"

        if [ "$warning_count" -gt 0 ]; then
          echo "✓ Found expected warnings with real Eigen"
        else
          echo "✗ No warnings found with real Eigen"
          cat output.log
          exit 1
        fi
