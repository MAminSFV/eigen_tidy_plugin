name: Eigen Tidy Plugin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-with-llvm-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_LOCAL_NAME: eigen-tidy-plugin

    strategy:
      matrix:
        include:
          - clang-version: 15
            ubuntu-version: jammy
          - clang-version: 16
            ubuntu-version: jammy
          - clang-version: 17
            ubuntu-version: noble
          - clang-version: 18
            ubuntu-version: noble
          - clang-version: 19
            ubuntu-version: noble

    steps:
    - uses: actions/checkout@v4

    - name: Compute image name (lowercase)
      id: meta
      shell: bash
      run: |
        echo "image_name=${GITHUB_REPOSITORY,,}/clang-base" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Test with Clang ${{ matrix.clang-version }} on ${{ matrix.ubuntu-version }}
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace \
          ghcr.io/${{ steps.meta.outputs.image_name }}:clang-${{ matrix.clang-version }}-${{ matrix.ubuntu-version }} \
          bash -c "\
            set -euxo pipefail; \
            git config --global --add safe.directory /workspace; \
            cd /workspace; \
          ./tools/build_and_test.sh \
          "

    - name: Test Plugin with Clang ${{ matrix.clang-version }} on ${{ matrix.ubuntu-version }}
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace \
          ghcr.io/${{ steps.meta.outputs.image_name }}:clang-${{ matrix.clang-version }}-${{ matrix.ubuntu-version }} \
          bash -c "
            set -euxo pipefail
            git config --global --add safe.directory /workspace
            cd /workspace/eigen_tidy_plugin
            echo 'Testing plugin with Clang ${{ matrix.clang-version }} on ${{ matrix.ubuntu-version }}...'
            clang-tidy-${{ matrix.clang-version }} \
              --load ./build/eigen_tidy_plugin/eigen_tidy_plugin.so \
              --checks='-*,eigen-avoid-auto' \
              tests/test_cases.cpp \
              -- -std=c++17 \
              | tee output.log

            # Check that we got expected warnings
            warning_count=\$(grep -c 'eigen-avoid-auto' output.log || true)
            echo \"Found \$warning_count warnings with Clang ${{ matrix.clang-version }} on ${{ matrix.ubuntu-version }}\"

            if [ \"\$warning_count\" -ge 4 ]; then
              echo '✓ Found expected warnings ('\$warning_count' >= 4)'
            else
              echo '✗ Expected at least 4 warnings, found '\$warning_count
              cat output.log
              exit 1
            fi
          "
