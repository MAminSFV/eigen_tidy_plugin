name: Eigen Tidy Plugin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-with-llvm-matrix:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        clang-version: [15, 16, 17, 18]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Test with Clang ${{ matrix.clang-version }}
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace \
          my-tidy-plugin:clang-${{ matrix.clang-version }} \
          bash -c "cd /workspace && ./tools/build_and_test.sh"

    - name: Test Plugin with Clang ${{ matrix.clang-version }}
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace \
          my-tidy-plugin:clang-${{ matrix.clang-version }} \
          bash -c "
            cd /workspace/eigen_tidy_plugin
            echo 'Testing plugin with Clang ${{ matrix.clang-version }}...'
            clang-tidy \
              --load ./build/eigen_tidy_plugin.so \
              --checks='-*,eigen-avoid-auto' \
              tests/test_cases.cpp \
              -- -std=c++17 \
              | tee output.log

            # Check that we got expected warnings
            warning_count=\$(grep -c 'eigen-avoid-auto' output.log || true)
            echo \"Found \$warning_count warnings with Clang ${{ matrix.clang-version }}\"

            if [ \"\$warning_count\" -ge 4 ]; then
              echo '✓ Found expected warnings ('\$warning_count' >= 4)'
            else
              echo '✗ Expected at least 4 warnings, found '\$warning_count
              cat output.log
              exit 1
            fi
          "
