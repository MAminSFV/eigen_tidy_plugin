name: Build & Publish Debian Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine project version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          # Extract version from tag (remove 'v' prefix if present)
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
        else
          # Use commit hash for branch builds
          VERSION="0.1.0-${GITHUB_SHA::8}"
        fi
        echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV
        echo "Determined version: $VERSION"
      shell: bash

    - name: Compute builder image reference
      id: meta
      shell: bash
      run: |
        echo "builder_image=ghcr.io/${GITHUB_REPOSITORY,,}/builder:latest" >> "$GITHUB_OUTPUT"

    - name: Run release build script inside builder image
      env:
        PROJECT_VERSION: ${{ env.PROJECT_VERSION }}
      run: |
        docker run --rm \
          -e PROJECT_VERSION="$PROJECT_VERSION" \
          -v "${{ github.workspace }}:/workspace" \
          "${{ steps.meta.outputs.builder_image }}" \
          bash -lc '
            apt-get update && \
            apt-get install -y --no-install-recommends \
              cmake ninja-build dpkg-dev build-essential git \
              libeigen3-dev libgtest-dev && \
            git config --global --add safe.directory /workspace && \
            cd /workspace && \
            ./tools/release.sh --version "$PROJECT_VERSION"
          '

    - name: Show build artifacts
      run: |
        echo "Generated files:"
        find eigen_tidy_plugin/build -name "*.deb" -ls
        find repo -type f -ls

    - name: Publish to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: repo

    - name: Upload .deb as artifact
      uses: actions/upload-artifact@v4
      with:
        name: debian-package-${{ github.sha }}
        path: eigen_tidy_plugin/build/*.deb

    - name: Upload repository as artifact
      uses: actions/upload-artifact@v4
      with:
        name: apt-repository-${{ github.sha }}
        path: repo/
