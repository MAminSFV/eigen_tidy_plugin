name: Build & Publish Clang/LLVM Base Images

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io


jobs:
  build-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        clang: [15, 16, 17, 18]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image name (lowercase)
        id: meta
        shell: bash
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}/clang-base" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push clang-base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./tools/Dockerfile
          target: clang-base
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:clang-${{ matrix.clang }}
            ${{ matrix.clang == 18 && format('{0}/{1}:latest', env.REGISTRY, steps.meta.outputs.image_name) || '' }}
          build-args: |
            CLANG_VERSION=${{ matrix.clang }}
